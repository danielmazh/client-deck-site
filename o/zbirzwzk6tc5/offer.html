  const fromRaw = (b64) => crypto.subtle.importKey("raw", Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)), "AES-GCM", true, ["decrypt"]);
  let saved = null; try { saved = localStorage.getItem(K); } catch (e) {}
  const form = document.getElementById("f");
  if (saved) { form.style.visibility = "hidden"; fromRaw(saved).then(open).catch(() => { form.style.visibility = ""; try { localStorage.removeItem(K); } catch (e) {} }); }
  document.getElementById("f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const err = document.getElementById("err"); err.textContent = "";
    try {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value.trim()), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: SALT, iterations: 310000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      await open(key);
      try { localStorage.setItem(K, btoa(String.fromCharCode(...raw))); } catch (e) {}
    } catch (e) { err.textContent = "הסיסמה לא נכונה"; }
  });
})();
</script>
